# ==============================================================================
# 3.8 ネーミング (3.8.1, 3.8.2)
# name: ワークフロー名
# run-name: 実行履歴一覧に表示される動的な実行名
# ==============================================================================
name: Chapter 3 Practice Workflow
run-name: Chapter 3 run by @${{ github.actor }} on ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions タブから手動でワンクリック実行可能

# 3.2.2 ワークフローレベルの環境変数
env:
  SCOPE_LEVEL: "Workflow Level"
  GLOBAL_CONFIG: "Default App Config"

# 3.10.2 パーミッションの最小権限設定（リポジトリの読み込み権限を明示）
permissions:
  contents: read

jobs:
  chapter3-syntax-check:
    name: Verify Chapter 3 Workflow Syntax
    runs-on: ubuntu-latest

    # 3.2.2 ジョブレベルの環境変数（ワークフローレベルをオーバーライド可能）
    env:
      SCOPE_LEVEL: "Job Level"
      JOB_ENV_VAR: "Defined at Job Level"

    steps:
      # ------------------------------------------------------------------------
      # 3.1 コンテキスト (3.1.1 github, 3.1.2 runner)
      # 3.2.4 中間環境変数のベストプラクティス（ダブルクォートで安全に参照）
      # ------------------------------------------------------------------------
      - name: "3.1 & 3.2.4: Contexts and Intermediate Environment Variables"
        env:
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          echo "=== 3.1 コンテキスト & 3.2.4 中間環境変数 ==="
          echo "GitHub Actor: ${ACTOR}"
          echo "Repository  : ${REPOSITORY}"
          echo "Run ID      : ${RUN_ID}"
          echo "Runner OS   : ${RUNNER_OS}"
          echo "Runner Arch : ${RUNNER_ARCH}"

      # ------------------------------------------------------------------------
      # 3.2 環境変数 (3.2.1 参照, 3.2.2 オーバーライド, 3.2.3 デフォルト環境変数)
      # ------------------------------------------------------------------------
      - name: "3.2: Environment Variables Hierarchy and Defaults"
        env:
          # ステップレベルでさらにオーバーライド（ステップ > ジョブ > ワークフロー）
          SCOPE_LEVEL: "Step Level"
        run: |
          echo "=== 3.2 環境変数とオーバーライド ==="
          echo "SCOPE_LEVEL (最優先のStepレベル): ${SCOPE_LEVEL}"
          echo "JOB_ENV_VAR (Jobレベル定義): ${JOB_ENV_VAR}"
          echo "GLOBAL_CONFIG (Workflowレベル定義): ${GLOBAL_CONFIG}"
          echo "--- デフォルト環境変数 ---"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_SHA     : ${GITHUB_SHA}"

      # ------------------------------------------------------------------------
      # 3.3 Variables & 3.4 Secrets
      # ------------------------------------------------------------------------
      - name: "3.3 & 3.4: Variables and Secrets Masking"
        env:
          # vars や secrets が未登録でもエラーにならない安全な取得
          SAMPLE_VAR: ${{ vars.SAMPLE_VARIABLE || 'Variables is not configured' }}
          # secrets.GITHUB_TOKEN はリポジトリ設定不要で自動発行される
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 3.3 Variables & 3.4 Secrets ==="
          echo "Variables value: ${SAMPLE_VAR}"
          # Secrets は出力時に自動で *** にマスクされる
          echo "GitHub Token (Masked): ${TOKEN}"

      # ------------------------------------------------------------------------
      # 3.5 式 (Expressions) & 3.6 関数 (Functions)
      # ------------------------------------------------------------------------
      - name: "3.5 & 3.6: Expressions, Literals, and Built-in Functions"
        env:
          # 3.5 リテラルと論理・比較演算子
          IS_EQUAL: ${{ 10 == 10 && 'apple' != 'banana' }}
          # 3.6.1 文字列比較関数 contains()
          CONTAINS_CHECK: ${{ contains('Hello GitHub Actions', 'GitHub') }}
          # 3.6.2 文字列生成関数 format()
          GREETING: ${{ format('{0}, {1}!', 'Hello', 'World') }}
        run: |
          echo "=== 3.5 式 と 3.6 関数 ==="
          echo "演算子評価結果: ${IS_EQUAL}"
          echo "contains() 判定: ${CONTAINS_CHECK}"
          echo "format() 結果  : ${GREETING}"

      # 3.6.3 toJSON() によるコンテキストダンプ
      - name: "3.6.3: Dump Runner Context with toJSON"
        env:
          RUNNER_JSON: ${{ toJSON(runner) }}
        run: |
          echo "=== runnerコンテキストのJSONダンプ ==="
          echo "${RUNNER_JSON}"

      # 3.6.4 hashFiles() の動作確認（checkout後にハッシュ計算）
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: "3.6.4: Generate Hash with hashFiles"
        env:
          WORKFLOW_HASH: ${{ hashFiles('.github/workflows/*.yml') }}
        run: |
          echo "=== hashFiles() によるSHA-256ハッシュ ==="
          echo "Workflows hash: ${WORKFLOW_HASH}"

      # ------------------------------------------------------------------------
      # 3.9 ステップ間のデータ共有 (3.9.1 GITHUB_OUTPUT, 3.9.2 GITHUB_ENV)
      # ------------------------------------------------------------------------
      - name: "3.9: Set Shared Data (Producer Step)"
        id: producer # stepsコンテキストから参照するためのID
        run: |
          echo "=== 3.9 ステップ間データ共有（書き込み） ==="
          # 3.9.1 推奨: GITHUB_OUTPUT へ書き出し
          echo "custom_message=Data from Producer Step" >> "${GITHUB_OUTPUT}"
          echo "build_number=42" >> "${GITHUB_OUTPUT}"
          # 3.9.2 GITHUB_ENV へ書き出し
          echo "DYNAMIC_ENV=Dynamically Generated Value" >> "${GITHUB_ENV}"

      - name: "3.9: Consume Shared Data (Consumer Step)"
        env:
          # steps.<step-id>.outputs.<key> で受け取り
          OUTPUT_MSG: ${{ steps.producer.outputs.custom_message }}
          BUILD_NUM: ${{ steps.producer.outputs.build_number }}
        run: |
          echo "=== 3.9 ステップ間データ共有（受け取り） ==="
          echo "steps.producer.outputs.custom_message : ${OUTPUT_MSG}"
          echo "steps.producer.outputs.build_number   : ${BUILD_NUM}"
          # GITHUB_ENV で書き出した値はそのまま通常の環境変数として参照可能
          echo "GITHUB_ENV で注入された値             : ${DYNAMIC_ENV}"

      # ------------------------------------------------------------------------
      # 3.7 条件分岐 & ステータスチェック関数 (3.7.1)
      # ------------------------------------------------------------------------
      - name: "3.7: Step that always runs"
        if: ${{ always() }}
        run: |
          echo "=== 3.7 条件分岐: always() ==="
          echo "このステップは先行ステップの成否に関わらず常に実行されます。"

      - name: "3.7: Conditional Step based on Expression"
        # 式の条件が真のときのみ実行
        if: ${{ success() && runner.os == 'Linux' }}
        run: |
          echo "=== 3.7 条件分岐: Linux ランナー時のみ実行 ==="
          echo "先行ステップが成功し、かつ Linux 環境であるため実行されました。"

      # ------------------------------------------------------------------------
      # 3.10 GitHub API の実行 (GitHub CLI と GITHUB_TOKEN)
      # ------------------------------------------------------------------------
      - name: "3.10: Call GitHub API via GitHub CLI"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 3.10 GitHub APIの実行 (gh api) ==="
          # permissions: contents: read の権限でリポジトリ情報をAPIから取得
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{name: .name, default_branch: .default_branch, visi